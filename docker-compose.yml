services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sermon_clipper
      POSTGRES_USER: sermon_clipper
      POSTGRES_PASSWORD: sermon_clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sermon_clipper -d sermon_clipper"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/app.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sermon_clipper:sermon_clipper@postgres:5432/sermon_clipper?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      WORK_ROOT: /app/work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - work_data:/app/work
    command: >
      sh -lc "npx prisma db push --schema prisma/schema.prisma && npm run start --workspace @sermon-clipper/api"

  worker:
    build:
      context: .
      dockerfile: infra/app.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sermon_clipper:sermon_clipper@postgres:5432/sermon_clipper?schema=public
      REDIS_URL: redis://redis:6379
      WORK_ROOT: /app/work
      WORKER_MODE: all
      GPU_WORKER_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - work_data:/app/work
    command: >
      sh -lc "npx prisma db push --schema prisma/schema.prisma && npm run start --workspace @sermon-clipper/worker"

volumes:
  postgres_data:
  redis_data:
  work_data: