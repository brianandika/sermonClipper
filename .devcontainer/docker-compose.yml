services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    gpus: all
    command: sleep infinity
    volumes:
      - .:/workspaces/sermonClipper:cached
    environment:
      DATABASE_URL: postgresql://sermon_clipper:sermon_clipper@postgres:5432/sermon_clipper?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      SESSION_TTL_DAYS: "7"
      RESULT_TTL_DAYS: "7"
      WORKER_MODE: all
      GPU_WORKER_CONCURRENCY: "1"
      WORK_ROOT: /workspaces/sermonClipper/work
      NVIDIA_DRIVER_CAPABILITIES: "all"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    ports: !reset []

  redis:
    ports: !reset []
